<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoyalBet Palace · Schedine & Cavalli</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="casino-container">

  <h1>
    <img src="images/corona.png" alt="corona">
    ROYALBET PALACE
    <img src="images/corona.png" alt="corona">
  </h1>
  <div class="brand-subtitle">Schedine &amp; Corse Reali</div>

  <div class="credit-bar">
    <img src="images/gettoni.png" alt="gettoni">
    CREDITO: <span id="saldoDisplay" class="saldo">500</span>
    <img src="images/gettoni.png" alt="gettoni">
  </div>

  <div class="section-grid">

    <!-- SEZIONE SCHEDINE CALCIO -->
    <div class="card">
      <div class="card-header">
        <img src="images/pallone.png" alt="pallone">
        <h2>SCHEDINE CALCIO</h2>
      </div>
      <div class="match-list" id="matchList"></div>
      <div class="schedina-footer">
        <div class="puntata-box">
          <label>PUNTATA</label>
          <input type="number" id="puntataCalcio" value="20" min="1" step="1">
        </div>
        <button class="play-btn" id="giocaCalcio">GIOCA</button>
      </div>
    </div>

    <!-- SEZIONE CAVALLI -->
    <div class="card">
      <div class="card-header">
        <img src="images/cavallo.png" alt="cavallo">
        <h2>CORSE CAVALLI</h2>
      </div>
      <div class="horse-track" id="horseList"></div>
      <div class="cavalli-footer">
        <div class="puntata-box">
          <label>PUNTATA</label>
          <input type="number" id="puntataCavalli" value="20" min="1" step="1">
        </div>
        <button class="play-btn" id="giocaCavalli">GIOCA</button>
      </div>
      <div class="message-area" id="messaggioCavalli">Seleziona un cavallo e punta</div>
    </div>

  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
